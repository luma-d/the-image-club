name: Build and publish site
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build.py
      - name: Optimize gallery images
        run: |
          pip install --quiet pillow
          python3 - <<'EOF'
          from PIL import Image, ImageOps
          import glob
          for p in glob.glob("docs/assets/gallery/*"):
              if p.rsplit(".", 1)[-1].lower() not in ("jpg", "jpeg", "png", "webp"):
                  continue
              im = ImageOps.exif_transpose(Image.open(p)).convert("RGB")
              im.thumbnail((1600, 1600), Image.LANCZOS)
              im.save(p, "JPEG", quality=82, optimize=True, progressive=True)
          EOF
      - name: Publish docs/ to gh-pages
        run: |
          cd docs
          git init -q
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "deploy $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
